<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 353 396" role="img" aria-labelledby="equilibrium-e1-pr-cost-title equilibrium-e1-pr-cost-description" class="eq-chart" data-chart="E1" font-family="'Gill Sans', 'Gill Sans MT', Seravek, Candara, 'Noto Sans', 'Segoe UI', system-ui, sans-serif" font-variant-numeric="tabular-nums">
  <title id="equilibrium-e1-pr-cost-title">What one merged pull request costs: machine against human review</title>
  <desc id="equilibrium-e1-pr-cost-description">Three horizontal ranges on a log dollar scale for 107 merged bot pull requests. Machine cost under the subscription sits around sixty cents; the same work at list price sits around ten dollars; human review sits around twenty dollars, so even the list price is below human review at the median.</desc>
