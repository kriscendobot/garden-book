<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 353 378" role="img" aria-labelledby="equilibrium-e2-list-vs-paid-title equilibrium-e2-list-vs-paid-description" class="eq-chart" data-chart="E2" font-family="'Gill Sans', 'Gill Sans MT', Seravek, Candara, 'Noto Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="equilibrium-e2-list-vs-paid-title">List price against what was paid, by month</title>
  <desc id="equilibrium-e2-list-vs-paid-description">Paired bars on a log dollar scale for July to October 2026. Each month the ledger list price is between five and twenty times the flat fee actually paid, and the ratio rises as the fleet meters more of its work under a fixed fee. An earlier study point, about 8.7 times, stands apart at the left.</desc>
  <defs><pattern id="equilibrium-e2-list-vs-paid-hatch-moss" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#627A57"/><path d="M1.5 0V6" stroke="#FBF8F0" stroke-width="2" opacity="0.7"/></pattern></defs>
  <text x="0" y="16" font-size="13" font-weight="600" fill="currentColor">List price against the flat fee paid (log scale)</text><rect x="0" y="28" width="14" height="12" fill="#9CAF88" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="19" y="38" font-size="12" fill="currentColor">list price (observed)</text><rect x="156" y="28" width="14" height="12" fill="url(#equilibrium-e2-list-vs-paid-hatch-moss)" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="175" y="38" font-size="12" fill="currentColor">flat fee paid (derived)</text><path d="M58 250L351 250" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="53" y="254" font-size="12" text-anchor="end" fill="currentColor">$10</text><path d="M58 190L351 190" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="53" y="194" font-size="12" text-anchor="end" fill="currentColor">$100</text><path d="M58 130L351 130" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="53" y="134" font-size="12" text-anchor="end" fill="currentColor">$1,000</text><path d="M58 70L351 70" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="53" y="74" font-size="12" text-anchor="end" fill="currentColor">$10,000</text><circle cx="86" cy="200.56" r="5" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="86" y="189.56" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">≈8.7×</text><text x="86" y="266" font-size="12" text-anchor="middle" fill="currentColor">Study</text><text x="86" y="282" font-size="12" text-anchor="middle" fill="currentColor">7/28–8/2</text><path d="M116 64L116 252" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1" stroke-dasharray="3 3"/><rect x="129.63" y="166.09" width="20" height="83.91" fill="#9CAF88" class="eq-outline" stroke="#6A6253" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="151.63" y="209.67" width="20" height="40.33" fill="url(#equilibrium-e2-list-vs-paid-hatch-moss)" class="eq-outline" stroke="#6A6253" stroke-width="1.5" stroke-dasharray="3 2"/><text x="150.63" y="160.09" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">5.3×</text><text x="150.63" y="266" font-size="12" text-anchor="middle" fill="currentColor">Jul</text><text x="150.63" y="282" font-size="12" text-anchor="middle" font-style="italic" fill="currentColor">partial</text><rect x="186.88" y="84.2" width="20" height="165.8" fill="#9CAF88" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="208.88" y="153.88" width="20" height="96.12" fill="url(#equilibrium-e2-list-vs-paid-hatch-moss)" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="207.88" y="78.2" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">14.5×</text><text x="207.88" y="266" font-size="12" text-anchor="middle" fill="currentColor">Aug</text><rect x="244.13" y="78.31" width="20" height="171.69" fill="#9CAF88" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="266.13" y="153.88" width="20" height="96.12" fill="url(#equilibrium-e2-list-vs-paid-hatch-moss)" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="265.13" y="72.31" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">18.2×</text><text x="265.13" y="266" font-size="12" text-anchor="middle" fill="currentColor">Sep</text><rect x="301.38" y="135.2" width="20" height="114.8" fill="#9CAF88" class="eq-outline" stroke="#6A6253" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="323.38" y="212.56" width="20" height="37.44" fill="url(#equilibrium-e2-list-vs-paid-hatch-moss)" class="eq-outline" stroke="#6A6253" stroke-width="1.5" stroke-dasharray="3 2"/><text x="322.38" y="129.2" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">19.5×</text><text x="322.38" y="266" font-size="12" text-anchor="middle" fill="currentColor">Oct</text><text x="322.38" y="282" font-size="12" text-anchor="middle" font-style="italic" fill="currentColor">partial</text><path d="M58 250L351 250" fill="none" stroke="currentColor" stroke-width="1"/><text x="0" y="306" font-size="12" fill="currentColor">Jul: partial month, ledger sparse.</text><text x="0" y="322" font-size="12" fill="currentColor">Sep: a third pool from 9/17, price unknown.</text><text x="0" y="338" font-size="12" fill="currentColor">Oct: partial, to the cutoff only.</text><text x="0" y="354" font-size="12" fill="currentColor">Window: $14,138.66 list, $889.09 paid, 15.9×.</text><text x="0" y="370" font-size="12" fill="currentColor">Study: flat fee $66.67, list price not restated.</text>
