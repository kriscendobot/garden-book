<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 353 426" role="img" aria-labelledby="equilibrium-e4-review-latency-title equilibrium-e4-review-latency-description" class="eq-chart" data-chart="E4" font-family="'Gill Sans', 'Gill Sans MT', Seravek, Candara, 'Noto Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="equilibrium-e4-review-latency-title">How long each kind of review takes</title>
  <desc id="equilibrium-e4-review-latency-description">Five ranges on a log time scale from one minute to sixty days. Machine review steps take minutes; the first human review takes about a day; merging takes two and a half days on the bot fork and about five days upstream, with long tails.</desc>
