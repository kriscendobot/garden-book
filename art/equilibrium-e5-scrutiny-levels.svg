iny-levels-hatch-moss)" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="192" y="144" font-size="12" font-weight="600" fill="currentColor">$0.089 ($0.428)</text><text x="192" y="158" font-size="12" fill="currentColor">n = 3,033</text><text x="0" y="184" font-size="12" fill="currentColor">Upstream</text><rect x="66" y="173" width="120" height="14" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1"/><text x="126" y="184" font-size="12" text-anchor="middle" font-style="italic" fill="currentColor">not recorded</text><path d="M0 204L353 204" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="0" y="220" font-size="12" font-weight="600" fill="currentColor">Attempts ending in requeue · observed</text><text x="0" y="248" font-size="12" fill="currentColor">Garden</text><path d="M66 235L66 253" fill="none" stroke="currentColor" stroke-width="1"/><rect x="66" y="238" width="25.03" height="12" fill="#B8CF9B" stroke="#627A57" stroke-width="2"/><text x="192" y="242" font-size="12" font-weight="600" fill="currentColor">21%</text><text x="192" y="256" font-size="12" fill="currentColor">287 of 1,376</text><text x="0" y="282" font-size="12" fill="currentColor">Bot fork</text><path d="M66 269L66 287" fill="none" stroke="currentColor" stroke-width="1"/><rect x="66" y="272" width="44.18" height="12" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="192" y="276" font-size="12" font-weight="600" fill="currentColor">37%</text><text x="192" y="290" font-size="12" fill="currentColor">2,606 of 7,079</text><text x="0" y="316" font-size="12" fill="currentColor">Upstream</text><rect x="66" y="305" width="120" height="14" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1"/><text x="126" y="316" font-size="12" text-anchor="middle" font-style="italic" fill="currentColor">not recorded</text><path d="M0 336L353 336" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="0" y="352" font-size=