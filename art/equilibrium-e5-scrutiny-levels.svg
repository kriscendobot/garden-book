<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 353 710" role="img" aria-labelledby="equilibrium-e5-scrutiny-levels-title equilibrium-e5-scrutiny-levels-description" class="eq-chart" data-chart="E5" font-family="'Gill Sans', 'Gill Sans MT', Seravek, Candara, 'Noto Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="equilibrium-e5-scrutiny-levels-title">Three levels of scrutiny: garden, bot fork, and upstream</title>
  <desc id="equilibrium-e5-scrutiny-levels-description">Four small panels compare the garden, the bot fork, and upstream. A garden job and a bot-fork job cost about the same nine cents; the difference lies in retries and in human review rounds; the upstream path has the fewest records and the longest wait. Missing measures are empty slots labeled not recorded.</desc>
  <defs><pattern id="equilibrium-e5-scrutiny-levels-hatch-fresh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#B8CF9B"/><path d="M1.5 0V6" stroke="#FBF8F0" stroke-width="2" opacity="0.7"/></pattern><pattern id="equilibrium-e5-scrutiny-levels-hatch-moss" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#627A57"/><path d="M1.5 0V6" stroke="#FBF8F0" stroke-width="2" opacity="0.7"/></pattern></defs>
