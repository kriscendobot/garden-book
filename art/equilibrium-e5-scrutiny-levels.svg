eight="12" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="192" y="556" font-size="12" font-weight="600" fill="currentColor">59.9 h</text><text x="192" y="570" font-size="12" fill="currentColor">n = 296</text><text x="0" y="596" font-size="12" fill="currentColor">Upstream</text><path d="M66 583L66 601" fill="none" stroke="currentColor" stroke-width="1"/><rect x="66" y="586" width="118.4" height="12" fill="#B9ACCC" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="192" y="590" font-size="12" font-weight="600" fill="currentColor">118.4 h</text><text x="192" y="604" font-size="12" fill="currentColor">n = 14</text><path d="M0 616L353 616" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="0" y="632" font-size="12" fill="currentColor">Mean as an open diamond. Empty slot: not recorded.</text><text x="0" y="654" font-size="12" fill="currentColor">Repair-named jobs (self-heal, fu-self-heal, fix-,</text><text x="0" y="670" font-size="12" fill="currentColor">fu-fix- prefixes), observed proxy, Garden: Jul 93</text><text x="0" y="686" font-size="12" fill="currentColor">of 339; Aug 46 of 286; Sep 106 of 597. Bot fork:</text><text x="0" y="702" font-size="12" fill="currentColor">not computed. Upstream: not recorded.</text>
