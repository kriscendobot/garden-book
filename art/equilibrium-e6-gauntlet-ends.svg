<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 353 494" role="img" aria-labelledby="equilibrium-e6-gauntlet-ends-title equilibrium-e6-gauntlet-ends-description" class="eq-chart" data-chart="E6" font-family="'Gill Sans', 'Gill Sans MT', Seravek, Candara, 'Noto Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="equilibrium-e6-gauntlet-ends-title">Where the gauntlet ends</title>
  <desc id="equilibrium-e6-gauntlet-ends-description">A histogram of the highest panel stage per pull request and one bar of panel-run outcomes. The most common outcome is a gauntlet that uses all six rounds; panel runs almost always return a must-fix list, and one in five returns no verdict at all.</desc>
  <text x="0" y="16" font-size="13" font-weight="600" fill="currentColor">Where the gauntlet ends</text><text x="0" y="38" font-size="12" font-weight="600" fill="currentColor">(a) Highest panel stage per PR, n = 161 PRs</text><path d="M36 214L351 214" fill="none" stroke="currentColor" stroke-width="1"/><text x="30" y="218" font-size="12" text-anchor="end" fill="currentColor">0</text><path d="M36 174L351 174" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="30" y="178" font-size="12" text-anchor="end" fill="currentColor">20</text><path d="M36 134L351 134" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="30" y="138" font-size="12" text-anchor="end" fill="currentColor">40</text><path d="M36 94L351 94" fill="none" class="eq-grid" stroke="#DDD5C4" stroke-width="1"/><text x="30" y="98" font-size="12" text-anchor="end" fill="currentColor">60</text><rect x="43" y="186" width="31" height="28" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="58.5" y="181" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">14</text><text x="58.5" y="230" font-size="12" text-anchor="middle" fill="currentColor">0</text><rect x="88" y="112" width="31" height="102" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="103.5" y="107" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">51</text><text x="103.5" y="230" font-size="12" text-anchor="middle" fill="currentColor">1</text><rect x="133" y="192" width="31" height="22" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="148.5" y="187" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">11</text><text x="148.5" y="230" font-size="12" text-anchor="middle" fill="currentColor">2</text><rect x="178" y="204" width="31" height="10" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="193.5" y="199" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">5</text><text x="193.5" y="230" font-size="12" text-anchor="middle" fill="currentColor">3</text><rect x="223" y="190" width="31" height="24" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="238.5" y="185" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">12</text><text x="238.5" y="230" font-size="12" text-anchor="middle" fill="currentColor">4</text><rect x="268" y="208" width="31" height="6" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="283.5" y="203" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">3</text><text x="283.5" y="230" font-size="12" text-anchor="middle" fill="currentColor">5</text><rect x="313" y="84" width="31" height="130" fill="#E6CF7A" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="328.5" y="79" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">65</text><text x="328.5" y="230" font-size="12" text-anchor="middle" fill="currentColor">6</text><text x="351" y="58" font-size="12" text-anchor="end" font-weight="600" fill="currentColor">cap (--max-iterations default)</text><path d="M328.5 62L328.5 66" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="0" y="248" font-size="12" fill="currentColor">Highest numbered panel stage. 0: clean or fix stages,</text><text x="0" y="264" font-size="12" fill="currentColor">no numbered panel.</text><text x="0" y="288" font-size="12" font-weight="600" fill="currentColor">(b) Panel-run outcomes, n = 869 runs,</text><text x="0" y="304" font-size="12" font-weight="600" fill="currentColor">2026-09-23 to the cutoff</text><rect x="2" y="316" width="271.09" height="20" fill="#C98267" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="273.09" y="316" width="8.84" height="20" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="281.92" y="316" width="69.08" height="20" fill="#E8D8B9" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="2" y="354" font-size="12" font-weight="600" fill="currentColor">must-fix 675</text><path d="M277.51 338L277.51 342" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="277.51" y="354" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">pass 22</text><path d="M316.46 338L316.46 360" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="351" y="374" font-size="12" text-anchor="end" font-weight="600" fill="currentColor">no verdict 172</text><text x="0" y="400" font-size="12" fill="currentColor">No verdict: error 111, seat error 40, interrupted 15,</text><text x="0" y="416" font-size="12" fill="currentColor">max rounds 4, decider error 2.</text><text x="0" y="438" font-size="12" fill="currentColor">346 of the 675 must-fix runs hit the 20-item</text><text x="0" y="454" font-size="12" fill="currentColor">recording cap, so must-fix counts cannot show</text><text x="0" y="470" font-size="12" fill="currentColor">convergence; 18 of 174 PRs with a verdict ended</text><text x="0" y="486" font-size="12" fill="currentColor">on a pass.</text>
</svg>
