<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 353 606" role="img" aria-labelledby="equilibrium-e7-review-learning-title equilibrium-e7-review-learning-description" class="eq-chart" data-chart="E7" font-family="'Gill Sans', 'Gill Sans MT', Seravek, Candara, 'Noto Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="equilibrium-e7-review-learning-title">What review comments are about, and what the garden learned</title>
  <desc id="equilibrium-e7-review-learning-description">A top-to-bottom flow from 534 classified review comments. Four of five are new direction that no machine check could have made; of the fifth that were misses, most recurring patterns that got a fix had their members before it, with eight later recurrences. Caveat: clusters are dispatched only after three misses across two pull requests, so members accumulate before a fix by construction; suggestive, not measured.</desc>
  <defs><pattern id="equilibrium-e7-review-learning-hatch-sage" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#9CAF88"/><path d="M1.5 0V6" stroke="#FBF8F0" stroke-width="2" opacity="0.7"/></pattern><pattern id="equilibrium-e7-review-learning-hatch-terracotta" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#C98267"/><path d="M1.5 0V6" stroke="#FBF8F0" stroke-width="2" opacity="0.7"/></pattern></defs>
  <text x="0" y="16" font-size="13" font-weight="600" fill="currentColor">Review comments, and what was learned</text><text x="0" y="54" font-size="24" font-weight="600" fill="currentColor">534</text><text x="56" y="54" font-size="12" fill="currentColor">classified review comments</text><rect x="2" y="62" width="349" height="18" fill="#D99A7E" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><path d="M176.5 80L176.5 95" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><path d="M172.5 94L180.5 94L176.5 100Z" class="eq-outline-fill" fill="#6A6253"/><text x="2" y="118" font-size="24" font-weight="600" fill="currentColor">422</text><text x="58" y="118" font-size="12" fill="currentColor">new direction (79%)</text><text x="351" y="118" font-size="24" text-anchor="end" font-weight="600" fill="currentColor">112</text><rect x="2" y="124" width="275.8" height="18" fill="#C98267" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="277.8" y="124" width="73.2" height="18" fill="#9CAF88" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="351" y="158" font-size="12" text-anchor="end" fill="currentColor">misses (21%)</text><text x="2" y="158" font-size="12" font-style="italic" fill="currentColor">no machine check could have made these</text><text x="351" y="174" font-size="12" text-anchor="end" fill="currentColor">70 minor, 21 moderate, 19 major, 2 unrecorded</text><path d="M314.4 178L314.4 193" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><path d="M310.4 192L318.4 192L314.4 198Z" class="eq-outline-fill" fill="#6A6253"/><text x="0" y="222" font-size="24" font-weight="600" fill="currentColor">52</text><text x="42" y="222" font-size="12" fill="currentColor">clusters of misses</text><rect x="2" y="230" width="87.25" height="18" fill="#627A57" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="89.25" y="230" width="13.42" height="18" fill="#E6CF7A" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="102.67" y="230" width="248.33" height="18" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="2" y="264" font-size="12" fill="currentColor">13 closed</text><text x="351" y="264" font-size="12" text-anchor="end" fill="currentColor">37 open</text><path d="M95.96 250L95.96 270" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="91.96" y="282" font-size="12" fill="currentColor">2 improvement dispatched</text><path d="M176.5 286L176.5 301" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><path d="M172.5 300L180.5 300L176.5 306Z" class="eq-outline-fill" fill="#6A6253"/><text x="0" y="330" font-size="24" font-weight="600" fill="currentColor">18</text><text x="42" y="330" font-size="12" fill="currentColor">clusters with a recorded improvement commit</text><rect x="2" y="338" width="120.81" height="18" fill="#9CAF88" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="128.81" y="352" font-size="12" fill="currentColor">of 52</text><path d="M60 356L60 371" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><path d="M56 370L64 370L60 376Z" class="eq-outline-fill" fill="#6A6253"/><text x="0" y="396" font-size="12" font-weight="600" fill="currentColor">their dated members, against the commit date</text><rect x="2" y="404" width="220.14" height="22" fill="url(#equilibrium-e7-review-learning-hatch-sage)" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="222.14" y="404" width="42.95" height="22" fill="url(#equilibrium-e7-review-learning-hatch-terracotta)" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="265.09" y="404" width="85.91" height="22" fill="#E8D8B9" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="10" y="452" font-size="24" font-weight="600" fill="currentColor">41</text><text x="48" y="452" font-size="12" fill="currentColor">before the commit</text><path d="M243.62 428L243.62 462" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><text x="248.62" y="484" font-size="24" font-weight="600" fill="currentColor">8</text><text x="237.62" y="482" font-size="12" text-anchor="end" fill="currentColor">after (in 5 clusters)</text><text x="351" y="452" font-size="12" text-anchor="end" fill="currentColor">16 undated</text><path d="M2 426L2 576" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="3"/><rect x="8" y="498" width="343" height="78" fill="none" class="eq-outline" stroke="#6A6253" stroke-width="1.5"/><rect x="8" y="498" width="4" height="78" fill="#C98267"/><text x="14" y="518" font-size="12" fill="currentColor">Clusters are dispatched only after three</text><text x="14" y="534" font-size="12" fill="currentColor">misses across two pull requests, so members</text><text x="14" y="550" font-size="12" fill="currentColor">accumulate before a fix by construction.</text><text x="14" y="566" font-size="12" fill="currentColor">Suggestive, not measured.</text><text x="0" y="598" font-size="12" fill="currentColor">Counts observed; the hatched before/after split is derived.</text>
</svg>
