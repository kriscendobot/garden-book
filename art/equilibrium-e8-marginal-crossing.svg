<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 353 648" role="img" aria-labelledby="equilibrium-e8-marginal-crossing-title equilibrium-e8-marginal-crossing-description" class="eq-chart" data-chart="E8" font-family="'Gill Sans', 'Gill Sans MT', Seravek, Candara, 'Noto Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="equilibrium-e8-marginal-crossing-title">The marginal crossing (scenario)</title>
  <desc id="equilibrium-e8-marginal-crossing-description">Scenario, not observed. In an illustrative model, total expected cost first falls as review minutes rise, reaches a minimum, then rises along the cost of the reviewer's time; the higher the stakes, the later the minimum: 13, 41, and 70 minutes for losses of $100, $400, and $1,600. A second panel splits the $400 case into rising human dollars, falling residual loss, and flat machine cost.</desc>
