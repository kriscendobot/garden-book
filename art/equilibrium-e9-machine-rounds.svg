  <title id="equilibrium-e9-machine-rounds-title">Machine rounds substitute, then stop (scenario)</title>
  <desc id="equilibrium-e9-machine-rounds-description">Scenario, not observed. In the same model, adding machine review rounds lowers the best human review time and the total cost at first, then both flatten near six rounds, because machine review cannot address the new-direction share that makes up most human review.</desc>
