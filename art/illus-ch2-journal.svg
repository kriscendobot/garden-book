<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect class="ms-ground" x="4" y="4" width="792" height="392" rx="8"/>
  <rect class="ms-gild-s" x="12" y="12" width="768" height="376" rx="5" fill="none" stroke-width="2"/>
  <g aria-hidden="true" fill="none" stroke-width="2.2" stroke-linecap="round"><path class="ms-stem" d="M400 24c-60 18-120 18-180 0M400 24c60 18 120 18 180 0"/></g>
  <!-- three leaves of one triptych, vines crossing the gutters to a central clasp -->
