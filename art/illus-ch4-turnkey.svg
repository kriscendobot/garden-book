<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect class="ms-ground" x="4" y="4" width="632" height="352" rx="8"/>
  <rect class="ms-gild-s" x="12" y="12" width="616" height="328" rx="5" fill="none" stroke-width="2"/>
  <!-- cloud, rain, and root ornaments terminating at the edge -->
