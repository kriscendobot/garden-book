    <circle class="ms-ink" cx="150" cy="250" r="12"/><path class="ms-ink" d="M150 262v40M150 300l-18 30M150 300l18 30M150 274h26"/>
    <circle class="ms-gild" cx="188" cy="270" r="6" stroke="none"/><path class="ms-gild-s" d="M194 270h14M202 270v8" stroke-width="1.6"/>
    <path class="ms-stone-s" d="M60 330h520"/>
