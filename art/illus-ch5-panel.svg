<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect class="ms-ground" x="4" y="4" width="792" height="392" rx="8"/>
  <rect class="ms-gild-s" x="12" y="12" width="768" height="376" rx="5" fill="none" stroke-width="2"/>
  <!-- the arbor forms a restrained arch, not a courtroom -->
  <path class="ms-stem" d="M120 150C260 60 540 60 680 150" fill="none" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"/>
