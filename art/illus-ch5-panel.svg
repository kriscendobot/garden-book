  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ms-ink" cx="200" cy="210" r="14"/><path class="ms-ink" d="M212 222l16 16"/>
    <circle class="ms-ink" cx="230" cy="310" r="14"/><path class="ms-ink" d="M242 322l16 16"/>
    <circle class="ms-ink" cx="600" cy="210" r="14"/><path class="ms-ink" d="M588 222l-16 16"/>
    <circle class="ms-ink" cx="570" cy="310" r="14"/><path class="ms-ink" d="M558 322l-16 16"/>
  </g>
  <!-- ribbons converge into one mechanical sorting device, not a judge -->
  <path class="ms-rubric-s" d="M214 224c60 40 130 60 186 64M244 324c50 10 110 8 156-36M586 224c-60 40-130 60-186 64M556 324c-50 10-110 8-156-36" fill="none" stroke-width="1.6" opacity=".8"/>
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="ms-gild-s" d="M360 330h80v40h-80Z"/><path class="ms-gild-s" d="M375 330v40M400 330v40M425 330v40"/></g>
