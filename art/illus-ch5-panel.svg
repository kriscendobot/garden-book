  <!-- a folio on a rotating stand at the centre -->
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path class="ms-ground2" d="M360 150h80v120h-80Z" stroke="none"/>
    <path class="ms-ink" d="M360 150h80v120h-80ZM400 150v120M400 300v30M376 330h48"/>
    <path class="ms-rubric-s" d="M372 180h22M372 196h22M406 180h22M406 196h22" stroke-width="1.4"/>
