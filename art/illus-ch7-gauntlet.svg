    <g transform="translate(760 230)"><path class="ms-leaf" d="M0 10c-12-2-20-10-22-22 12 0 20 8 22 22Z" stroke="none"/><path class="ms-leaf2" d="M0 6c12-2 20-10 22-22-12 0-20 8-22 22Z" stroke="none"/><path class="ms-ink" d="M0 40V6"/></g>
