  <path class="ms-rubric-s" d="M540 214c0-50-120-60-240-20" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 6"/>
  <path class="ms-rubric-s" d="M300 194l6-12 10 6" fill="none" stroke-width="2.2" stroke-linecap="round"/>
