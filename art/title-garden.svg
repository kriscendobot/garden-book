<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title-garden-title title-garden-description">
  <title id="title-garden-title">A vine-and-trellis border framing the title page</title>
  <desc id="title-garden-description">A manuscript border ornament: slender trellis uprights rise at the corners, climbing vines and leaves run along the edges, and a low garden bed with small blooms gathers along the foot, leaving the centre open for the title.</desc>
  <!-- Redrawn from the first-edition garden scene as a title-page frame: the
       vine, trellis, and bed cropped to the margins, the centre left clear so
       the title sits on clean paper rather than a wash. -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- trellis uprights at the four corners -->
    <path class="ms-stone-s" d="M70 40v150M110 40v150M70 86h40M70 132h40"/>
    <path class="ms-stone-s" d="M1130 40v150M1090 40v150M1090 86h40M1090 132h40"/>
    <path class="ms-stone-s" d="M70 680V560M110 680V560M70 606h40M1130 680V560M1090 680V560M1090 606h40"/>
    <!-- climbing vines along the top and sides -->
    <path class="ms-stem" d="M110 70C260 44 360 72 500 56M700 56c140 16 240-12 390 14"/>
    <path class="ms-stem" d="M88 190c-14 90-14 210 0 300"/>
    <path class="ms-stem" d="M1112 190c14 90 14 210 0 300"/>
  </g>
  <!-- leaves and small blooms on the vines (decorative) -->
  <g stroke="none">
    <path class="ms-leaf" d="M300 50c-14-6-22-18-22-34 14 2 24 16 22 34ZM900 50c14-6 22-18 22-34-14 2-24 16-22 34Z"/>
    <path class="ms-leaf2" d="M88 280c-14-6-22-16-24-30 14 0 26 14 24 30ZM1112 280c14-6 22-16 24-30-14 0-26 14-24 30Z"/>
    <path class="ms-leaf" d="M88 420c14-6 24-16 26-30-14 0-26 14-26 30ZM1112 420c-14-6-24-16-26-30 14 0 26 14 26 30Z"/>
    <circle class="ms-gild" cx="500" cy="52" r="7"/><circle class="ms-rose" cx="700" cy="54" r="7"/>
  </g>
  <!-- a low garden bed with blooms along the foot -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path class="ms-stone-s" d="M150 666h900"/>
    <path class="ms-stem" d="M320 666v-40M360 666v-52M400 666v-40M820 666v-44M860 666v-54M900 666v-42"/>
  </g>
  <g stroke="none">
    <path class="ms-leaf" d="M320 626c-12-2-20-10-22-22 12 0 20 8 22 22Z"/><path class="ms-leaf2" d="M400 626c12-2 20-10 22-22-12 0-20 8-22 22Z"/>
    <path class="ms-leaf2" d="M820 622c-12-2-20-10-22-22 12 0 20 8 22 22Z"/><path class="ms-leaf" d="M900 624c12-2 20-10 22-22-12 0-20 8-22 22Z"/>
    <circle class="ms-gild" cx="360" cy="608" r="7"/><circle class="ms-rose" cx="860" cy="606" r="7"/>
  </g>
</svg>
